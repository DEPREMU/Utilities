<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clipboard</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(145deg, #1c1c1c, #141414);
        color: #f1f1f1;
        overflow: hidden;
      }

      .container {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 10px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      h1 {
        font-size: 16px;
        font-weight: 600;
      }

      .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #2e2e2e;
        color: #aaa;
      }

      .search {
        width: 100%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        color: #f1f1f1;
        outline: none;
      }

      .search::placeholder {
        color: #888;
      }

      .clipboard-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .clipboard-item {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        animation: fadeIn 0.2s ease;
        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }

      .clipboard-item:hover {
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-1px);
      }

      .clipboard-item:active {
        transform: scale(0.96);
      }

      .item-id {
        font-size: 10px;
        color: #888;
        margin-bottom: 4px;
        font-family: monospace;
      }

      .item-content {
        font-size: 13px;
        line-height: 1.4;
        word-break: break-word;
        max-height: 70px;
        overflow: hidden;
      }

      .empty-state {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        font-size: 13px;
      }

      .snackbar {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #2e2e2e;
        color: #fff;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 12px;
        opacity: 0;
        transition: all 0.25s ease;
        pointer-events: none;
      }

      .snackbar.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .start {
        height: 1px;
        width: 100%;
        background-color: transparent;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Clipboard</h1>
        <span class="badge">History</span>
      </header>

      <input
        class="search"
        id="searchInput"
        placeholder="Search by id or content..."
      />

      <div class="clipboard-list" id="clipboardList">
        <div class="empty-state">Loading items…</div>
      </div>
    </div>

    <div class="snackbar" id="snackbar">Copied to clipboard</div>

    <script>
      "use strict";

      /** @type {{id:string, content:string}[]} */
      let clipboardItems = [];

      const loadClipboardItems = async () => {
        const list = document.getElementById("clipboardList");
        try {
          clipboardItems = await window.UtilitiesForPC.getClipboardHistory();

          renderItems(clipboardItems);

          window.UtilitiesForPC.onClipboardItemsUpdated((items) => {
            clipboardItems = items;
            renderItems(clipboardItems);
          });
        } catch {
          list.innerHTML = `<div class="empty-state">⚠️ Error loading clipboard</div>`;
        }
      };

      const renderItems = (items) => {
        const list = document.getElementById("clipboardList");

        if (!items.length) {
          list.innerHTML = `<div class="empty-state">📭 No results</div>`;
          return;
        }

        list.innerHTML = items
          .map(
            ({ id, content }) => `
              <div class="clipboard-item" onclick="copyById('${id}')">
                <div class="item-id">${escapeHtml(id)}</div>
                <div class="item-content">${escapeHtml(content)}</div>
              </div>
            `,
          )
          .join("");
        list.scrollTop = 0;
      };

      const copyById = (id) => {
        const item = clipboardItems.find((i) => i.id === id);
        if (!item) return;

        window.UtilitiesForPC?.setClipboard(item.content);
        showSnackbar();
        setTimeout(() => window.UtilitiesForPC?.hideClipboardWindow(), 450);
      };

      const escapeHtml = (text) => {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      };

      const showSnackbar = () => {
        const sb = document.getElementById("snackbar");
        sb.classList.add("show");
        setTimeout(() => sb.classList.remove("show"), 1200);
      };

      document.getElementById("searchInput").addEventListener("input", (e) => {
        const value = e.target.value.toLowerCase();
        renderItems(
          clipboardItems.filter(
            (i) =>
              i.id.toLowerCase().includes(value) ||
              i.content.toLowerCase().includes(value),
          ),
        );
      });

      document.addEventListener("DOMContentLoaded", loadClipboardItems);
    </script>
  </body>
</html>
