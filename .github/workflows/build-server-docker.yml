name: Build Server Docker Image

on:
  push:
    branches:
      - production
    paths:
      - "server/**"
      - "common/**"
      - "frontend/**"
      - "types/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/build-server-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image (Candidate)
    runs-on: ubuntu-latest
    environment: build-server
    timeout-minutes: 20
    concurrency:
      group: server-docker-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image layers (Warm cache)
        uses: docker/build-push-action@v6
        with:
          build-args: |
            API_URL=${{ secrets.API_URL }}
          context: .
          file: ./server/vps/docker/Dockerfile
          push: false
          cache-from: type=gha,scope=server-docker
          cache-to: type=gha,mode=max,scope=server-docker

  publish-and-deploy:
    name: Publish Latest & Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: build-server
    timeout-minutes: 25
    concurrency:
      group: server-docker-publish-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify publication eligibility (Superseded check)
        id: check-eligibility
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production --depth=1
          LATEST_PRODUCTION_SHA=$(git rev-parse origin/production)
          CURRENT_SHA="${{ github.sha }}"

          echo "Target production commit: $LATEST_PRODUCTION_SHA"
          echo "Current workflow commit: $CURRENT_SHA"

          if [ "${{ github.event_name }}" = "push" ] && [ "$LATEST_PRODUCTION_SHA" != "$CURRENT_SHA" ]; then
            echo "::warning::This execution ($CURRENT_SHA) has been superseded by a newer commit ($LATEST_PRODUCTION_SHA) on production."
            echo "Skipping Docker image publication and deployment to prevent overwriting production with obsolete state."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "### Deployment Skipped (Superseded)" >> "$GITHUB_STEP_SUMMARY"
            echo "Commit \`$CURRENT_SHA\` was superseded by \`$LATEST_PRODUCTION_SHA\` prior to publication." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check-eligibility.outputs.superseded != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check-eligibility.outputs.superseded != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image under latest
        if: steps.check-eligibility.outputs.superseded != 'true'
        uses: docker/build-push-action@v6
        with:
          build-args: |
            API_URL=${{ secrets.API_URL }}
          context: .
          file: ./server/vps/docker/Dockerfile
          push: true
          tags: |
            depremu/utilities-server:latest
            depremu/utilities-server:main-${{ github.sha }}
          cache-from: type=gha,scope=server-docker

      - name: Deploy to VPS & Verify Health (with Rollback)
        if: steps.check-eligibility.outputs.superseded != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd $HOME/Utilities/server/vps/docker

            echo "[VPS-Deploy] Backing up current running container image for rollback..."
            PREV_IMAGE=$(docker inspect --format='{{.Image}}' utilities-server 2>/dev/null || true)
            if [ -n "$PREV_IMAGE" ]; then
              docker tag "$PREV_IMAGE" depremu/utilities-server:rollback-previous 2>/dev/null || true
              echo "[VPS-Deploy] Saved previous image ($PREV_IMAGE) as rollback-previous."
            fi

            echo "[VPS-Deploy] Pulling new latest image from Docker Hub..."
            docker compose pull server

            echo "[VPS-Deploy] Recreating server container..."
            docker compose up -d --force-recreate server

            check_server_health() {
              docker compose exec -T server node -e "fetch('http://127.0.0.1:3000/api/info/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));" >/dev/null 2>&1
            }

            echo "[VPS-Deploy] Verifying server health inside container (http://127.0.0.1:3000/api/info/health)..."
            HEALTHY=false
            MAX_RETRIES=20
            RETRY_DELAY=5

            for i in $(seq 1 $MAX_RETRIES); do
              if check_server_health; then
                echo "[VPS-Deploy] Server health check passed on attempt $i (HTTP 200)!"
                docker compose exec -T server node -e "fetch('http://127.0.0.1:3000/api/info/health').then(r => r.text()).then(d => console.log('[VPS-Deploy] Health response:', d)).catch(() => {});" 2>/dev/null || true
                HEALTHY=true
                break
              fi
              echo "[VPS-Deploy] Attempt $i/$MAX_RETRIES: Server not ready or migrations in progress. Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "::error::Server health verification failed on VPS!"
              echo "[VPS-Deploy] Diagnostic container logs:"
              docker compose logs --tail=100 server || true

              if [ -n "$PREV_IMAGE" ]; then
                echo "[VPS-Deploy] Executing automated rollback to previous image..."
                docker tag depremu/utilities-server:rollback-previous depremu/utilities-server:latest
                docker compose up -d --force-recreate server
                sleep 5
                if check_server_health; then
                  echo "[VPS-Deploy] Rollback verified healthy!"
                else
                  echo "[VPS-Deploy] Rollback health check failed."
                fi
              fi
              exit 1
            fi

      - name: Record deployment summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.check-eligibility.outputs.superseded }}" != "true" ]; then
            echo "### Server Production Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Image**: \`depremu/utilities-server:latest\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Commit**: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Deployment Status**: ${{ job.status == 'success' && 'Success' || 'Failed' }}" >> "$GITHUB_STEP_SUMMARY"
          fi
