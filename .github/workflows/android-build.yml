      #     echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        # if: steps.version_check.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        # if: steps.version_check.outputs.should_build == 'true'
        run: yarn install

      - name: Prebuild Android
        # if: steps.version_check.outputs.should_build == 'true'
        run: yarn run app-prebuild-android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build Android App (Docker)
        # if: steps.version_check.outputs.should_build == 'true'
        run: |
          docker build -f scripts/app/Dockerfile.android -t app-android-build .
          docker run --rm \
            -v "${{ github.workspace }}/.git:/utilities/.git" \
            -v "${{ github.workspace }}/app/builds:/utilities/app/builds" \
            -e EXPO_TOKEN="${EXPO_TOKEN}" \
            -e BUILD_PROFILE=production \
            app-android-build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Upload Artifact (Primary)
        # if: steps.version_check.outputs.should_build == 'true'
        run: yarn run build-upload-android
        env:
          WS_URL: ${{ secrets.WS_URL }}
          API_URL: ${{ secrets.API_URL }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Artifact (Fallback)
        if: failure() && steps.version_check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-fallback
          path: app/builds/
          retention-days: 5
