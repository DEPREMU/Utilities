name: Android Build

on:
  push:
    branches:
      - production

jobs:
  build:
    runs-on: ubuntu-latest
    environment: build-android
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check version change
        id: version_check
        run: node scripts/check-version-ci.ts --platform=android
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: Install dependencies
        if: steps.version_check.outputs.should_build == 'true'
        run: yarn install

      - name: Pre-build Android
        if: steps.version_check.outputs.should_build == 'true'
        run: yarn run app-prebuild-android
        env:
          BUILD_PROFILE: production
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Clear android and google-services.json from .gitignore
        if: steps.version_check.outputs.should_build == 'true'
        run: sed -i '/^android\/$/d; /^google-services.json$/d' .gitignore

      - name: Build Android App (Docker)
        if: steps.version_check.outputs.should_build == 'true'
        run: |
          docker build -f scripts/app/Dockerfile.android -t app-android-build .
          docker run --rm \
            -v "${{ github.workspace }}/.git:/utilities/.git" \
            -v "${{ github.workspace }}/app/builds:/utilities/app/builds" \
            -e WS_URL="${WS_URL}" \
            -e API_URL="${API_URL}" \
            -e BUILD_PROFILE=production \
            -e EXPO_TOKEN="${EXPO_TOKEN}" \
            app-android-build
        env:
          WS_URL: ${{ secrets.WS_URL }}
          API_URL: ${{ secrets.API_URL }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Artifact (Primary)
        if: steps.version_check.outputs.should_build == 'true'
        run: yarn run build-upload-android
        env:
          WS_URL: ${{ secrets.WS_URL }}
          API_URL: ${{ secrets.API_URL }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload Artifact (Fallback)
        if: failure() && steps.version_check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-fallback
          path: app/builds/
          retention-days: 5
