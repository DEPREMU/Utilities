name: Build Electron App

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    environment: build-electron

    outputs:
      changed: ${{ steps.version-check.outputs.changed }}
      build_linux: ${{ steps.version-check.outputs.build_linux }}
      build_windows: ${{ steps.version-check.outputs.build_windows }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: yarn install

      - name: Check if version changed
        id: version-check
        shell: bash
        run: node scripts/check-version-ci.ts --platform=electron
        env:
          API_URL: ${{ secrets.API_URL }}

  build-and-upload:
    needs: check-version

    if: needs.check-version.outputs.changed == 'true'

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    environment: build-electron

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        if: (matrix.os == 'ubuntu-latest' && needs.check-version.outputs.build_linux == 'true') || (matrix.os == 'windows-latest' && needs.check-version.outputs.build_windows == 'true')
        run: yarn install

      - name: Build and Upload Electron App
        if: (matrix.os == 'ubuntu-latest' && needs.check-version.outputs.build_linux == 'true') || (matrix.os == 'windows-latest' && needs.check-version.outputs.build_windows == 'true')
        run: yarn run build-upload-electron
        env:
          WS_URL: ${{ secrets.WS_URL }}
          API_URL: ${{ secrets.API_URL }}
          BUILD_PROFILE: ${{ vars.BUILD_PROFILE }}

      - name: Upload Fallback Artifacts
        if: failure() && ((matrix.os == 'ubuntu-latest' && needs.check-version.outputs.build_linux == 'true') || (matrix.os == 'windows-latest' && needs.check-version.outputs.build_windows == 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: electron-builds-${{ matrix.os }}
          path: UtilitiesForPC/dist-electron/
          retention-days: 7
